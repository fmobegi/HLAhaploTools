# Build wheels for Linux, macOS and Windows and publish them to TestPyPI only.
#
# Started by hand: Actions > TestPyPI > Run workflow. Each run gets its own version,
# <version in pyproject.toml>.dev<run number> (e.g. 0.1.0.dev3), because an index
# never accepts the same version twice. Before an upload, every wheel is installed
# on a clean machine and run on the example data.
#
# One-time setup on test.pypi.org: Account settings > Publishing > add a pending
# publisher: project hlahaplotools, owner fmobegi, repository HLAhaploTools,
# workflow testpypi.yml, environment testpypi.
#
# Install a build with:
#   pip install --index-url https://test.pypi.org/simple/ --pre hlahaplotools

name: TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${base}.dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64 }
          - { name: macos-x86_64, os: macos-latest, target: x86_64 }
          - { name: macos-arm64, os: macos-latest, target: aarch64 }
          - { name: windows-x64, os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set the version
        shell: bash
        run: python scripts/set_version.py "${{ needs.version.outputs.version }}"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: Source package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        run: python3 scripts/set_version.py "${{ needs.version.outputs.version }}"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    name: Install and run (${{ matrix.name }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: examples
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - name: Install the wheel in a clean environment
        shell: bash
        run: |
          python -m venv venv
          if [ -x venv/Scripts/python ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          "$PY" -m pip install --quiet --no-index --find-links dist hlahaplotools
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: Run it
        shell: bash
        run: |
          BIN=$(dirname "$PY")
          "$BIN/hlahaplotools" --version
          "$BIN/hlahaplo" --version
          "$BIN/hlahaplotools" download-data --skip-mac --data-dir data
          "$BIN/hlahaplotools" estimate examples/population/population.dat \
            --loci A:2f,C:2f,B:2f,DRB1:2f,DQB1:2f --data-dir data -o out/population
          "$BIN/hlahaplotools" families examples/families/validated.csv \
            --loci A:2f,C:2f,B:2f,DRB1:2f,DQB1:2f --data-dir data -o out/families
          head -3 out/population/hfs.dat

  publish:
    name: Publish to TestPyPI
    needs: [version, wheels, sdist, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hlahaplotools/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
