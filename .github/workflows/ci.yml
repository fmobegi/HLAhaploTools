# Lint and test HLAhaploTools.
#
# Linux runs on every push to dev or main and on pull requests. Windows and macOS
# cost more Actions minutes on a private repository, so they run on pushes to main,
# on pull requests, and when started by hand (Actions > CI > Run workflow).
#
# Tests that need reference data use the IMGT/HLA files only (--skip-mac, a few MB,
# cached); the five tests that need the 600 MB NMDP MAC table are skipped.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # On pushes to dev, test Linux only.
          - os: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'windows-latest' || 'none' }}
          - os: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'macos-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Rust unit tests
        run: cargo test -p hlahaplotools-core

      - name: Build and install the package
        run: uv sync

      - name: Reference data (IMGT/HLA only)
        id: data
        uses: actions/cache@v4
        with:
          path: data
          key: imgthla-${{ hashFiles('src/hlahaplotools/reference_data.py', 'src/hlahaplotools/derive_tables.py') }}
      - name: Download reference data
        if: steps.data.outputs.cache-hit != 'true'
        run: uv run hlahaplotools download-data --skip-mac

      - name: Command line
        run: |
          uv run hlahaplotools --version
          uv run hlahaplo --version

      - name: Python tests
        run: uv run pytest -q
