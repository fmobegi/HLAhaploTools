[package]
name = "hlahaplotools"
version = "0.1.0-rc.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/fmobegi/HLAhaploTools"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py39"] }
hlahaplotools-core = { path = "crates/hlahaplotools-core" }
rayon = "1.12"

# Parsing, encoding and EM live in the pure-Rust core crate, so `cargo test`
# there runs without Python. This crate only holds the PyO3 bindings.
[workspace]
members = ["crates/hlahaplotools-core"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
